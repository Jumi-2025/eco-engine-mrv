name: Prototype tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PORT: 3107
          DATA_DIR: ${{ runner.temp }}/eco-engine-test-data
          UPLOADS_DIR: ${{ runner.temp }}/eco-engine-test-uploads
